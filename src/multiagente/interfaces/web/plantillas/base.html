<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Sesiones{% endblock %} · Sistema multiagente</title>
  <link rel="stylesheet" href="/estaticos/estilos.css">
  <script src="/estaticos/sondeo.js" defer></script>
</head>
<body>
  <header class="barra">
    <a class="marca" href="/">Sistema multiagente · Realtix</a>
    <nav>{% block navegacion %}<a href="/">Sesiones</a>{% endblock %}</nav>
  </header>
  <main>
    {% block contenido %}{% endblock %}
  </main>
  <footer>
    Interfaz local: solo responde en esta máquina. Cada paso queda guardado y una sesión se puede
    retomar en cualquier momento.
  </footer>
</body>
</html>
