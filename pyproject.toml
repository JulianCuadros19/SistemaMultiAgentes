# Configuración del código del sistema, el que escribe el equipo.
# El estilo del código que genera el agente desarrollador vive en config/estilo_generado/
# y no debe mezclarse con este archivo. Ver docs/decisiones/0001-empaquetado-y-dependencias.md.

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[project]
name = "multiagente"
dynamic = ["version"]
description = "Sistema multiagente de IA para Realtix: de la conversación con el cliente al código Python validado."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Julián Andrés Cuadros Muñoz" },
    { name = "Laura Catalina Riveros Flórez" },
]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
]
# BGE-M3 corre en el servicio `embeddings` (TEI); el sistema solo necesita su cliente HTTP.
dependencies = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "psycopg[binary,pool]>=3.3,<4",
    "openai>=3.19,<4",
    "langfuse>=4.15,<5",
    "httpx>=0.28,<1",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.16,<0.17",
]

[tool.hatch.version]
path = "src/multiagente/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/multiagente"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["config/estilo_generado", "knowledge_base", "evaluacion"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "ANN", "D"]
# N818 exige el sufijo inglés «Error»; los nombres de dominio van en español (ErrorXxx).
ignore = ["N818"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Las pruebas de integración requieren la base (`pytest -m integracion`), las de embeddings
# también el modelo BGE-M3 (`pytest -m embeddings`) y las de nube hacen llamadas reales que
# cuestan dinero (`pytest -m nube`). Ninguna corre por defecto.
addopts = [
    "-ra",
    "--import-mode=importlib",
    "--strict-markers",
    "-m",
    "not integracion and not nube and not embeddings",
]
markers = [
    "integracion: requiere los servicios de docker compose y el archivo .env",
    "nube: hace llamadas reales a Azure OpenAI, con costo; requiere el archivo .env",
    "embeddings: requiere los servicios db y embeddings (BGE-M3) de docker compose",
]
